persistence:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 768Mi}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: shop
        folder: Shop
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards/shop
dashboardsConfigMaps:
  shop: shop-dashboards
