persistence:
  enabled: false
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 768Mi}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
