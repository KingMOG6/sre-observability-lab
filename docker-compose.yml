services:
  payments:
    build: ./services/payments
    environment:
      ERROR_RATE: ${PAYMENTS_ERROR_RATE:-0}
      LATENCY_MS: ${PAYMENTS_LATENCY_MS:-20}
  orders:
    build: ./services/orders
    environment:
      PAYMENTS_URL: http://payments:8080
    depends_on: [payments]
  gateway:
    build: ./services/gateway
    environment:
      ORDERS_URL: http://orders:8080
    ports:
      - "8082:8080"
    depends_on: [orders]
