apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: payments}
  template:
    metadata:
      labels: {app: payments}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: payments
          image: shop-payments:dev
          ports: [{containerPort: 8080}]
          env:
            - {name: ERROR_RATE, value: "0"}
            - {name: LATENCY_MS, value: "20"}
          readinessProbe: {httpGet: {path: /health, port: 8080}}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: payments, namespace: shop}
spec:
  selector: {app: payments}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: orders
          image: shop-orders:dev
          ports: [{containerPort: 8080}]
          env:
            - {name: PAYMENTS_URL, value: "http://payments:8080"}
            - {name: ERROR_RATE, value: "0"}
            - {name: LATENCY_MS, value: "20"}
            - {name: DOWNSTREAM_TIMEOUT, value: "1.0"}
          readinessProbe: {httpGet: {path: /health, port: 8080}}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: orders, namespace: shop}
spec:
  selector: {app: orders}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: gateway
          image: shop-gateway:dev
          ports: [{containerPort: 8080}]
          env:
            - {name: ORDERS_URL, value: "http://orders:8080"}
            - {name: ERROR_RATE, value: "0"}
            - {name: LATENCY_MS, value: "10"}
            - {name: DOWNSTREAM_TIMEOUT, value: "2.0"}
          readinessProbe: {httpGet: {path: /health, port: 8080}}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: shop}
spec:
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080}]
